<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#06060a" />
  <title>SplitClo — 顏值時鐘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #06060a;
      --fg: #f5f5f7;
      --muted: #9b9ba8;
      --split-line: rgba(255, 255, 255, 0.1);
      --card: rgba(255, 255, 255, 0.03);
      --accent: #a78bfa;
      --accent-glow: rgba(167, 139, 250, 0.5);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --spring: cubic-bezier(0.34, 1.25, 0.64, 1);
      --spring-soft: cubic-bezier(0.22, 1.15, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; width: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation; perspective: 1200px;
    }

    .orient-lock {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.75rem;
      background: var(--bg); opacity: 0; pointer-events: none;
      transition: opacity 0.55s var(--ease-out);
    }
    .orient-lock.visible { opacity: 1; pointer-events: auto; }
    .orient-icon {
      width: 72px; height: 72px; border: 2px solid var(--muted); border-radius: 16px;
      position: relative; animation: rotate-hint 2.8s var(--ease-in-out) infinite;
      transform-style: preserve-3d;
    }
    .orient-icon::before {
      content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 22px; height: 4px; background: var(--muted); border-radius: 2px;
    }
    @keyframes rotate-hint {
      0%, 18% { transform: rotateY(0deg) rotate(0deg); }
      38%, 62% { transform: rotateY(12deg) rotate(90deg); }
      82%, 100% { transform: rotateY(0deg) rotate(0deg); }
    }
    .orient-text { font-size: 1rem; font-weight: 600; letter-spacing: 0.03em; color: var(--muted); text-align: center; line-height: 1.55; }
    .orient-brand { position: absolute; bottom: 2.8rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); opacity: 0.55; }

    .app {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 1; transition: opacity 0.6s var(--ease-out);
      transform-style: preserve-3d;
    }
    .app.hidden { opacity: 0; pointer-events: none; }

    .ambient { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.38;
      animation: orb-float 20s var(--ease-in-out) infinite; will-change: transform;
    }
    .orb-1 { width: 58vw; height: 58vw; top: -18%; left: -12%; background: radial-gradient(circle, rgba(167,139,250,0.28) 0%, transparent 70%); animation-duration: 24s; }
    .orb-2 { width: 48vw; height: 48vw; bottom: -22%; right: -10%; background: radial-gradient(circle, rgba(99,102,241,0.22) 0%, transparent 70%); animation-duration: 28s; animation-delay: -7s; }
    .orb-3 { width: 32vw; height: 32vw; top: 38%; left: 52%; background: radial-gradient(circle, rgba(236,72,153,0.14) 0%, transparent 70%); animation-duration: 21s; animation-delay: -13s; }
    @keyframes orb-float {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      33% { transform: translate3d(5%,-4%,20px) scale(1.07); }
      66% { transform: translate3d(-4%,5%,-10px) scale(0.95); }
    }
    .noise {
      position: absolute; inset: 0; opacity: 0.04; pointer-events: none; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .clock-shell {
      position: relative; z-index: 5;
      width: min(94vw, 960px); aspect-ratio: 16/9; max-height: 76vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
      transform-style: preserve-3d;
      animation: shell-enter 1.1s var(--spring-soft) both;
    }
    @keyframes shell-enter {
      from { opacity: 0; transform: translateY(24px) rotateX(8deg) scale(0.96); }
      to { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
    }

    .split-frame {
      position: absolute; inset: 0; border-radius: 32px;
      background: var(--card); border: 1px solid var(--split-line); overflow: hidden;
      transform-style: preserve-3d;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.025),
        0 40px 120px -30px rgba(0,0,0,0.75),
        0 0 80px -20px rgba(167,139,250,0.12),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: frame-float 12s var(--ease-in-out) infinite;
    }
    @keyframes frame-float {
      0%, 100% { transform: translateZ(0) rotateX(0deg) rotateY(0deg); }
      25% { transform: translateZ(8px) rotateX(1.2deg) rotateY(-1.5deg); }
      50% { transform: translateZ(4px) rotateX(-0.8deg) rotateY(1deg); }
      75% { transform: translateZ(10px) rotateX(0.6deg) rotateY(-0.8deg); }
    }
    .split-frame::before {
      content: ""; position: absolute; top: 0; left: 50%; width: 1px; height: 100%;
      background: linear-gradient(to bottom, transparent 6%, var(--split-line) 28%, var(--split-line) 72%, transparent 94%);
      transform: translateX(-50%); z-index: 2;
    }
    .split-half { position: absolute; top: 0; bottom: 0; width: 50%; }
    .split-half.left { left: 0; background: radial-gradient(ellipse at 25% 35%, rgba(167,139,250,0.08) 0%, transparent 65%); }
    .split-half.right { right: 0; background: radial-gradient(ellipse at 75% 65%, rgba(99,102,241,0.07) 0%, transparent 65%); }

    .time-row {
      position: relative; z-index: 6;
      display: flex; align-items: baseline; justify-content: center; gap: 0.1em;
      font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
      letter-spacing: -0.03em; user-select: none;
      transform-style: preserve-3d;
    }
    .digit-group { display: flex; gap: 0.01em; transform-style: preserve-3d; }
    .digit {
      font-family: "Geist", sans-serif; font-weight: 700;
      font-size: clamp(5rem, 19.5vw, 10.5rem); line-height: 0.86;
      color: var(--fg); position: relative; display: inline-block;
      min-width: 0.55em; text-align: center;
      transform-style: preserve-3d; will-change: transform, opacity, filter;
      text-shadow: 0 2px 24px rgba(0,0,0,0.35), 0 0 40px rgba(167,139,250,0.08);
    }
    .digit.flip { animation: digit-flip-3d 0.6s var(--spring); }
    @keyframes digit-flip-3d {
      0% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); filter: blur(0); }
      30% { opacity: 0.2; transform: translateY(-14%) rotateX(-28deg) scale(0.92); filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); filter: blur(0); }
    }
    .colon {
      font-family: "Geist", sans-serif; font-weight: 600;
      font-size: clamp(4.2rem, 16.5vw, 9rem); line-height: 0.86;
      color: var(--fg); opacity: 0.48; margin: 0 -0.03em;
      animation: colon-breathe 2.2s var(--ease-in-out) infinite;
      transform-style: preserve-3d;
    }
    @keyframes colon-breathe {
      0%, 100% { opacity: 0.48; transform: scale(1) translateZ(0); }
      50% { opacity: 0.18; transform: scale(0.96) translateZ(-6px); }
    }

    .seconds-wrap {
      position: absolute; right: 6.5%; bottom: 15%; z-index: 6;
      display: flex; align-items: center; justify-content: center;
      width: clamp(44px, 7.2vw, 60px); height: clamp(44px, 7.2vw, 60px);
      transform-style: preserve-3d;
      animation: sec-float 6s var(--ease-in-out) infinite;
    }
    @keyframes sec-float {
      0%, 100% { transform: translateZ(12px) rotateY(0deg); }
      50% { transform: translateZ(18px) rotateY(4deg); }
    }
    .seconds-ring { position: absolute; inset: 0; transform: rotate(-90deg); }
    .seconds-ring circle { fill: none; stroke-width: 2.6; stroke-linecap: round; }
    .seconds-ring .track { stroke: rgba(255,255,255,0.09); }
    .seconds-ring .progress {
      stroke: var(--accent); stroke-dasharray: 113.1; stroke-dashoffset: 113.1;
      transition: stroke-dashoffset 0.15s linear;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }
    .seconds {
      font-family: "JetBrains Mono", monospace; font-weight: 600;
      font-size: clamp(0.88rem, 2.5vw, 1.18rem); letter-spacing: 0.04em;
      color: var(--muted); position: relative; z-index: 1;
    }

    .meta {
      position: relative; z-index: 6;
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem; margin-top: 0.3rem;
      transform: translateZ(8px);
    }
    .date {
      font-size: clamp(0.84rem, 2.15vw, 1.08rem); font-weight: 600;
      letter-spacing: 0.09em; color: var(--muted); text-transform: uppercase; opacity: 0.92;
    }
    .brand {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--muted); opacity: 0.38; margin-top: 0.5rem;
    }

    .controls {
      position: fixed; bottom: max(1.35rem, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 0.75rem;
      background: rgba(10, 10, 16, 0.78);
      backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.09); border-radius: 999px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03);
      transition: opacity 0.45s var(--ease-out), transform 0.45s var(--spring);
    }
    .controls.idle { opacity: 0.32; transform: translateX(-50%) translateY(8px) scale(0.97); }
    .controls:hover, .controls:focus-within, .controls.active {
      opacity: 1; transform: translateX(-50%) translateY(0) scale(1);
    }

    .ctrl-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none; background: transparent;
      color: var(--fg); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.22s var(--ease-out), transform 0.18s var(--spring);
      position: relative; flex-shrink: 0;
    }
    .ctrl-btn:active { transform: scale(0.9); }
    .ctrl-btn:hover { background: rgba(255,255,255,0.09); }
    .ctrl-btn svg {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    }
    .ctrl-btn.primary svg { width: 20px; height: 20px; }
    .ctrl-btn.playing svg, .ctrl-btn.fill svg { fill: currentColor; stroke: none; }

    .track-info {
      display: flex; flex-direction: column; min-width: 0; max-width: 0; overflow: hidden;
      padding: 0; opacity: 0;
      transition: opacity 0.4s var(--ease-out), max-width 0.5s var(--spring), padding 0.4s var(--ease-out);
    }
    .track-info.visible { opacity: 1; max-width: 150px; padding: 0 0.45rem; }
    .track-name {
      font-size: 0.74rem; font-weight: 600; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; color: var(--fg);
    }
    .track-meta {
      font-size: 0.62rem; font-weight: 500; color: var(--muted); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-progress {
      height: 2.5px; background: rgba(255,255,255,0.12); border-radius: 2px;
      margin-top: 5px; overflow: hidden;
    }
    .track-progress-bar {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #c4b5fd);
      border-radius: 2px; transition: width 0.2s linear;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    input[type="file"] { display: none; }

    .fs-tip {
      position: fixed; top: max(1.2rem, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%) translateY(-14px); z-index: 30;
      padding: 0.55rem 1.15rem; background: rgba(16,16,24,0.88);
      backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px;
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s var(--ease-out), transform 0.5s var(--spring);
    }
    .fs-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    @media (prefers-reduced-motion: reduce) {
      .digit.flip, .orient-icon, .colon, .orb, .split-frame, .seconds-wrap, .clock-shell {
        animation: none !important; transition: none !important;
      }
      .orient-icon { transform: rotate(90deg); }
      .colon { opacity: 0.4; }
      .orb { opacity: 0.22; }
    }

    @media (orientation: portrait) {
      .app { opacity: 0; pointer-events: none; }
      .orient-lock { opacity: 1; pointer-events: auto; }
      .controls, .fs-tip { display: none; }
    }
    @media (orientation: landscape) {
      .orient-lock { opacity: 0; pointer-events: none; }
      .app { opacity: 1; }
    }
    @media (max-height: 420px) and (orientation: landscape) {
      .digit { font-size: clamp(3.5rem, 15.5vw, 7.2rem); }
      .clock-shell { gap: 0.45rem; max-height: 70vh; }
      .seconds-wrap { bottom: 11%; }
      .controls { bottom: 0.7rem; transform: translateX(-50%) scale(0.9); }
    }
  </style>
</head>
<body>
  <div class="orient-lock" id="orientLock" aria-live="polite">
    <div class="orient-icon" aria-hidden="true"></div>
    <p class="orient-text">請將手機橫過來<br />才能使用 SplitClo</p>
    <span class="orient-brand">SplitClo</span>
  </div>

  <div class="fs-tip" id="fsTip">點擊任意處進入全螢幕</div>

  <div class="ambient" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="noise"></div>
  </div>

  <div class="app" id="app">
    <div class="clock-shell">
      <div class="split-frame">
        <div class="split-half left"></div>
        <div class="split-half right"></div>
      </div>

      <div class="time-row" id="timeRow" aria-label="目前時間">
        <div class="digit-group">
          <span class="digit" data-pos="h1">0</span>
          <span class="digit" data-pos="h2">0</span>
        </div>
        <span class="colon">:</span>
        <div class="digit-group">
          <span class="digit" data-pos="m1">0</span>
          <span class="digit" data-pos="m2">0</span>
        </div>
      </div>

      <div class="seconds-wrap">
        <svg class="seconds-ring" viewBox="0 0 40 40">
          <circle class="track" cx="20" cy="20" r="18" />
          <circle class="progress" id="secProgress" cx="20" cy="20" r="18" />
        </svg>
        <span class="seconds" id="seconds">00</span>
      </div>

      <div class="meta">
        <div class="date" id="date"></div>
        <div class="brand">SplitClo</div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl-btn" id="fsBtn" title="全螢幕" aria-label="切換全螢幕">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>

    <button class="ctrl-btn" id="musicBtn" title="上傳音樂（可多選）" aria-label="上傳本地歌曲">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>

    <button class="ctrl-btn" id="prevBtn" title="上一首" aria-label="上一首" style="display:none">
      <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>

    <button class="ctrl-btn primary fill" id="playBtn" title="播放 / 暫停" aria-label="播放或暫停" style="display:none">
      <svg viewBox="0 0 24 24" id="playIcon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>

    <button class="ctrl-btn" id="nextBtn" title="下一首" aria-label="下一首" style="display:none">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>

    <div class="track-info" id="trackInfo">
      <div class="track-name" id="trackName">—</div>
      <div class="track-meta" id="trackMeta"></div>
      <div class="track-progress"><div class="track-progress-bar" id="trackBar"></div></div>
    </div>

    <input type="file" id="fileInput" accept="audio/*" multiple />
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    (function () {
      const digits = {
        h1: document.querySelector('[data-pos="h1"]'),
        h2: document.querySelector('[data-pos="h2"]'),
        m1: document.querySelector('[data-pos="m1"]'),
        m2: document.querySelector('[data-pos="m2"]'),
      };
      const secondsEl = document.getElementById("seconds");
      const secProgress = document.getElementById("secProgress");
      const dateEl = document.getElementById("date");
      const orientLock = document.getElementById("orientLock");
      const app = document.getElementById("app");
      const controls = document.getElementById("controls");
      const fsBtn = document.getElementById("fsBtn");
      const musicBtn = document.getElementById("musicBtn");
      const prevBtn = document.getElementById("prevBtn");
      const playBtn = document.getElementById("playBtn");
      const nextBtn = document.getElementById("nextBtn");
      const playIcon = document.getElementById("playIcon");
      const fileInput = document.getElementById("fileInput");
      const audio = document.getElementById("audio");
      const trackInfo = document.getElementById("trackInfo");
      const trackName = document.getElementById("trackName");
      const trackMeta = document.getElementById("trackMeta");
      const trackBar = document.getElementById("trackBar");
      const fsTip = document.getElementById("fsTip");

      const CIRC = 2 * Math.PI * 18;
      secProgress.style.strokeDasharray = CIRC;

      const weekdays = ["週日","週一","週二","週三","週四","週五","週六"];
      const months = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

      let last = { h1:"", h2:"", m1:"", m2:"", s:"" };
      let controlsIdleTimer = null;
      let hasEnteredFs = false;

      let playlist = [];
      let currentIndex = 0;

      function pad(n) { return n.toString().padStart(2, "0"); }

      function update() {
        const now = new Date();
        const h = pad(now.getHours());
        const m = pad(now.getMinutes());
        const s = pad(now.getSeconds());
        const ms = now.getMilliseconds();
        const next = { h1:h[0], h2:h[1], m1:m[0], m2:m[1], s };

        Object.keys(digits).forEach((key) => {
          if (next[key] !== last[key]) {
            const el = digits[key];
            el.classList.remove("flip");
            void el.offsetWidth;
            el.textContent = next[key];
            el.classList.add("flip");
            last[key] = next[key];
          }
        });

        if (next.s !== last.s) {
          secondsEl.textContent = next.s;
          last.s = next.s;
        }

        const progress = (now.getSeconds() + ms / 1000) / 60;
        secProgress.style.strokeDashoffset = CIRC * (1 - progress);

        dateEl.textContent = months[now.getMonth()] + now.getDate() + "日 · " + weekdays[now.getDay()];
      }

      function checkOrientation() {
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        const portraitBySize = window.innerHeight > window.innerWidth;
        if (isPortrait || portraitBySize) {
          orientLock.classList.add("visible");
          app.classList.add("hidden");
        } else {
          orientLock.classList.remove("visible");
          app.classList.remove("hidden");
        }
      }

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }
      async function enterFullscreen() {
        const el = document.documentElement;
        try {
          if (el.requestFullscreen) await el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          hasEnteredFs = true;
          fsTip.classList.remove("show");
        } catch (e) {}
      }
      async function exitFullscreen() {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } catch (e) {}
      }
      function toggleFullscreen() {
        if (isFullscreen()) exitFullscreen();
        else enterFullscreen();
      }
      function showFsTip() {
        if (hasEnteredFs || isFullscreen()) return;
        setTimeout(function() { fsTip.classList.add("show"); }, 1100);
        setTimeout(function() { fsTip.classList.remove("show"); }, 5000);
      }

      function showPlayerUI() {
        prevBtn.style.display = "flex";
        playBtn.style.display = "flex";
        nextBtn.style.display = "flex";
        trackInfo.classList.add("visible");
      }

      function loadTrack(index) {
        if (!playlist.length) return;
        currentIndex = ((index % playlist.length) + playlist.length) % playlist.length;
        var track = playlist[currentIndex];
        audio.src = track.url;
        trackName.textContent = track.name;
        trackMeta.textContent = playlist.length > 1 ? (currentIndex + 1) + " / " + playlist.length : "";
        trackBar.style.width = "0%";
        audio.play().then(function() { setPlaying(true); }).catch(function() { setPlaying(false); });
        wakeControls();
      }

      function setPlaying(playing) {
        if (playing) {
          playBtn.classList.add("playing");
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        } else {
          playBtn.classList.remove("playing");
          playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        }
      }

      musicBtn.addEventListener("click", function() { fileInput.click(); });

      fileInput.addEventListener("change", function(e) {
        var files = Array.from(e.target.files || []);
        if (!files.length) return;
        playlist.forEach(function(t) { try { URL.revokeObjectURL(t.url); } catch(_){} });
        playlist = files.map(function(f) {
          return { name: f.name.replace(/\.[^/.]+$/, "") || "本地歌曲", url: URL.createObjectURL(f) };
        });
        currentIndex = 0;
        showPlayerUI();
        loadTrack(0);
      });

      prevBtn.addEventListener("click", function() {
        if (playlist.length < 2) { audio.currentTime = 0; return; }
        loadTrack(currentIndex - 1);
      });

      nextBtn.addEventListener("click", function() {
        if (playlist.length < 2) return;
        loadTrack(currentIndex + 1);
      });

      playBtn.addEventListener("click", function() {
        if (audio.paused) {
          audio.play().then(function() { setPlaying(true); });
        } else {
          audio.pause();
          setPlaying(false);
        }
        wakeControls();
      });

      audio.addEventListener("timeupdate", function() {
        if (!audio.duration) return;
        trackBar.style.width = ((audio.currentTime / audio.duration) * 100) + "%";
      });

      audio.addEventListener("ended", function() {
        if (playlist.length > 1) {
          loadTrack(currentIndex + 1);
        } else {
          setPlaying(false);
          trackBar.style.width = "0%";
        }
      });

      function wakeControls() {
        controls.classList.remove("idle");
        controls.classList.add("active");
        clearTimeout(controlsIdleTimer);
        controlsIdleTimer = setTimeout(function() {
          controls.classList.add("idle");
          controls.classList.remove("active");
        }, 3800);
      }

      fsBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        toggleFullscreen();
        wakeControls();
      });

      document.addEventListener("click", function(e) {
        if (!hasEnteredFs && !isFullscreen() && !e.target.closest(".controls") && !e.target.closest(".fs-tip")) {
          enterFullscreen();
        }
        wakeControls();
      });
      document.addEventListener("touchstart", function() { wakeControls(); }, { passive: true });

      update();
      checkOrientation();
      showFsTip();
      wakeControls();
      setInterval(update, 70);

      window.addEventListener("orientationchange", function() { setTimeout(checkOrientation, 120); });
      window.addEventListener("resize", checkOrientation);
      var mq = window.matchMedia("(orientation: portrait)");
      if (mq.addEventListener) mq.addEventListener("change", checkOrientation);
      else if (mq.addListener) mq.addListener(checkOrientation);

      document.addEventListener("gesturestart", function(e) { e.preventDefault(); });
      document.addEventListener("touchmove", function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
